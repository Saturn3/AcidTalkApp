name: acidtalk
description: "AcidTalk — client nativo per Android, iOS, Windows e macOS del backend AcidTalk 2.x (Laravel)."
publish_to: "none"
version: 2.4.1+25

environment:
  sdk: ^3.9.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.9.0
  shared_preferences: ^2.5.3
  provider: ^6.1.5
  flutter_widget_from_html_core: ^0.17.0
  file_picker: ^13.0.0
  record: ^7.1.0
  audioplayers: ^6.8.0
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.0.0
  web_socket_channel: ^3.0.3
  intl: ^0.20.2
  path_provider: ^2.1.5
  window_manager: ^0.5.1
  mime: ^2.0.0
  http_parser: ^4.1.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/emoji.json
